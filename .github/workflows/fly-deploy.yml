# See https://fly.io/docs/app-guides/continuous-deployment-with-github-actions/

name: Deploy to Fly

on:
  push:
    tags:
      - 'v*'             # deploy only when you push a tag like "v1.2.3"
  workflow_dispatch:    # also allow manual runs from the Actions UI

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to Fly
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          # deploy command - adjust if your Fly config or workflow differs
          fly deploy --config fly.toml --remote-only
